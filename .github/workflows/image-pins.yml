name: Image pins

# Every pinned image is a Docker Hub copy on public.ecr.aws or mirror.gcr.io.
# This compares each pin with the digest Docker Hub serves for its tag, so a
# stale pin shows up on pull requests and, through the daily run, on main.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-pins:
    name: Compare image pins with Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The check uses only Node built-ins, so it needs no install.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-image-pins.mjs
