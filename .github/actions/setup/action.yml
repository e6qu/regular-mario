name: Set up the toolchain
description: >-
  pnpm, Node and a frozen install — the toolchain every workflow needs, declared
  once so the pinned versions cannot drift apart between them. Checkout is NOT
  part of this: a local action cannot run before the checkout that fetches it,
  so each workflow checks out first and then uses this.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.3
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
